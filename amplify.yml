version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node -v
        - python3.11 --version
        - python3.11 -m pip install -r requirements.txt --user
    build:
      commands:
        - python3.11 kaktos.py build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
